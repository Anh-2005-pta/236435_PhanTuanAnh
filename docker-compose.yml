name: foods-236435-phantuananh

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: phantuananhnct/backend:latest
    ports:
      - "5000:5000"
    environment:
      PORT: "5000"
      MONGODB_URI: "${MONGODB_URI}"
      CORS_ORIGIN: "${CORS_ORIGIN:-*}"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: phantuananhnct/frontend:latest
    ports:
      - "5173:80"
    environment:
      API_URL: "${API_URL:-http://localhost:5000}"
    depends_on:
      - backend
    restart: unless-stopped
